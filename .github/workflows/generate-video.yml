name: Generate Promotional Video

on:
  push:
    paths:
      - "video-automation/input/**"
      - "video-automation/bgm/**"

permissions:
  contents: write

concurrency:
  group: generate-video-${{ github.ref }}
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Node dependencies
        run: npm install

      - name: Install ffmpeg and Japanese font
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg fonts-noto-cjk

      - name: Generate video
        id: generate
        run: node video-automation/scripts/generate-video.js

      - name: Commit generated video
        if: steps.generate.outputs.video_path != ''
        run: |
          git config user.name "tanabata-video-bot"
          git config user.email "actions@users.noreply.github.com"
          git add video-automation/output video-automation/input
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "自動生成: プロモーション動画"
          git pull --rebase origin "${{ github.ref_name }}"
          git push origin HEAD:"${{ github.ref_name }}"

      - name: Upload video to Vercel Blob
        if: steps.generate.outputs.video_path != ''
        id: upload
        env:
          BLOB_READ_WRITE_TOKEN: ${{ secrets.BLOB_READ_WRITE_TOKEN }}
        run: node video-automation/scripts/upload-blob.js "${{ steps.generate.outputs.video_path }}"

      - name: Publish to Instagram
        if: steps.generate.outputs.video_path != '' && steps.upload.outputs.blob_url != '' && env.INSTAGRAM_ACCESS_TOKEN != ''
        env:
          INSTAGRAM_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
          INSTAGRAM_BUSINESS_ACCOUNT_ID: ${{ secrets.INSTAGRAM_BUSINESS_ACCOUNT_ID }}
        run: |
          node video-automation/scripts/publish-instagram.js "${{ steps.upload.outputs.blob_url }}" "${{ steps.generate.outputs.caption }}"
